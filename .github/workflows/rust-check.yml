name: Rust and UI verification

on:
  push:
    branches: [main]
    paths:
      - 'crates/web-server/**'
      - 'crates/agent-harness/**'
      - 'crates/tool-runtime/**'
      - 'crates/cron/**'
      - 'crates/db/**'
      - 'infra-as-code/**'
      - 'crates/web-pages/**'
      - 'crates/web-assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/web-server/**'
      - 'crates/agent-harness/**'
      - 'crates/tool-runtime/**'
      - 'crates/cron/**'
      - 'crates/db/**'
      - 'infra-as-code/**'
      - 'crates/web-pages/**'
      - 'crates/web-assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/rust-check.yml'
  workflow_dispatch:

concurrency:
  group: rust-ui-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container:
      # Same build image used by the upstream Dagger pipeline; includes Rust,
      # Cornucopia and dbmate required by crates/db/build.rs.
      image: purtontech/rust-on-nails-devcontainer:1.3.46
      options: --user root
    services:
      postgres:
        image: ankane/pgvector
        env:
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpassword@postgres:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - name: Apply database migrations for Cornucopia query generation
        run: dbmate --wait --migrations-dir crates/db/migrations up
      - name: Build static assets for Rust compile-time embedding
        run: |
          npm --prefix crates/web-assets install
          npm --prefix crates/web-assets run release
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile web server and its UI dependencies
        run: cargo check -p web-server --locked
      - name: Run web server tests
        run: cargo test -p web-server --locked
      - name: Run Agent Runtime authentication and dialogue tests
        run: cargo test -p agent-harness --locked
      - name: Compile scheduled task worker
        run: cargo check -p cron@0.1.0 --locked
      - name: Run tool runtime tests
        run: cargo test -p tool-runtime --locked
  web-assets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/web-assets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/web-assets/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build browser assets
        run: npx parcel build ./index.ts --public-url /auth/static
