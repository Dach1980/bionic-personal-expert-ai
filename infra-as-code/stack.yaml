apiVersion: stack-cli.dev/v1
kind: StackApp
metadata:
  name: bionic-gpt
  namespace: bionic-gpt
spec:
  components:
    db: {}
  profiles:
    dev:
      components:
        oidc:
          hostname-url: http://localhost:30000
        ingress:
          port: 30000
        db:
          expose_db_port: 30001
      services:
        web:
          env:
            - name: LOGOUT_URL
              value: "/oidc/realms/bionic-gpt/protocol/openid-connect/logout"
            - name: OIDC_ISSUER
              value: "http://localhost:30000/oidc/realms/bionic-gpt"
            - name: OIDC_AUDIENCE
              value: "pea-api"
            - name: OIDC_JWKS_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/certs"
            - name: PEA_API_BASE_URL
              value: "http://host.docker.internal:8000"
        cron:
          env:
            - name: PEA_API_BASE_URL
              value: "http://host.docker.internal:8000"
            - name: PEA_OIDC_TOKEN_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/token"
            - name: PEA_WORKLOAD_CLIENT_ID
              value: "pea-bionic-worker"
          secret_env:
            - name: PEA_WORKLOAD_CLIENT_SECRET
              secret_name: pea-bionic-worker
              secret_key: client_secret
        integration-simulator:
          image: ghcr.io/bionic-gpt/integration-simulator:1.13.4
          port: 8080
    uat:
      components:
        oidc:
          # Required by keycloak for OIDC. OIDC requires a stable redirect URL.
          hostname-url: https://platform.bionic-gpt.com
      services:
        web:
          secret_env:
            - name: PEA_API_BASE_URL
              secret_name: pea-api-connection
              secret_key: base_url
          env:
            - name: LOGOUT_URL
              value: "/oidc/realms/bionic-gpt/protocol/openid-connect/logout"
            - name: OIDC_ISSUER
              value: "https://platform.bionic-gpt.com/oidc/realms/bionic-gpt"
            - name: OIDC_AUDIENCE
              value: "pea-api"
            - name: OIDC_JWKS_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/certs"
        cron:
          secret_env:
            - name: PEA_API_BASE_URL
              secret_name: pea-api-connection
              secret_key: base_url
            - name: PEA_WORKLOAD_CLIENT_SECRET
              secret_name: pea-bionic-worker
              secret_key: client_secret
          env:
            - name: PEA_OIDC_TOKEN_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/token"
            - name: PEA_WORKLOAD_CLIENT_ID
              value: "pea-bionic-worker"
    prod:
      components:
        oidc:
          # Required by keycloak for OIDC. OIDC requires a stable redirect URL.
          hostname-url: https://app.bionic-gpt.com
      services:
        web:
          secret_env:
            - name: PEA_API_BASE_URL
              secret_name: pea-api-connection
              secret_key: base_url
          env:
            - name: LOGOUT_URL
              value: "/oidc/realms/bionic-gpt/protocol/openid-connect/logout"
            - name: OIDC_ISSUER
              value: "https://app.bionic-gpt.com/oidc/realms/bionic-gpt"
            - name: OIDC_AUDIENCE
              value: "pea-api"
            - name: OIDC_JWKS_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/certs"
        cron:
          secret_env:
            - name: PEA_API_BASE_URL
              secret_name: pea-api-connection
              secret_key: base_url
            - name: PEA_WORKLOAD_CLIENT_SECRET
              secret_name: pea-bionic-worker
              secret_key: client_secret
          env:
            - name: PEA_OIDC_TOKEN_URL
              value: "http://keycloak-service.keycloak.svc.cluster.local:8080/realms/bionic-gpt/protocol/openid-connect/token"
            - name: PEA_WORKLOAD_CLIENT_ID
              value: "pea-bionic-worker"
  services:
    web:
      image: ghcr.io/bionic-gpt/bionicgpt:1.13.4
      port: 7703
      # Pass an env var called APP_DATABASE_URL which is the application_user role.
      database_url: APP_DATABASE_URL
      init:
        image: ghcr.io/bionic-gpt/bionicgpt-db-migrations:1.13.4
        migrations_database_url: DATABASE_URL
      env:
        - name: LOGOUT_URL
          value: "/oidc/realms/bionic-gpt/protocol/openid-connect/logout"

    cron:
      image: ghcr.io/bionic-gpt/bionicgpt-cron:1.13.4
      database_url: APP_DATABASE_URL

    rag-engine:
      image: ghcr.io/bionic-gpt/bionicgpt-rag-engine:1.13.4
      port: 7703
      database_url: APP_DATABASE_URL

    doc-engine:
      image: ghcr.io/xberg-io/xberg:1.0.14
      port: 8000

    cli-gateway:
      image: ghcr.io/bionic-gpt/bionicgpt-cli-gateway:1.13.4
      port: 8080

    office-tools:
      image: ghcr.io/bionic-gpt/office-tools:latest
      port: 8080

    cad-craft:
      image: ghcr.io/bionic-gpt/bionicgpt-cad-craft-mcp-app:latest
      port: 8080
